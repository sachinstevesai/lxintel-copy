<!doctype html>
<html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BriefWriter Prototype</title>
<link 
rel="icon" 
type="image/webp"
    href="https://www.ramoslaw.com/wp-content/uploads/2024/02/ramos-law-injury-intelligence-cross.webp"
    />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
    body {
        font-family: "Montserrat", sans-serif;
        background-color: #111;
        color: #f1c40f;
        margin: 0;
        height: 100vh;
        padding: 0px 1rem;
    }
    h1,
    h2,
    h3 {
        margin-top: 24px;
    }

    input[type=text],
    textarea,
    select {
        width: 100%;
        padding: 8px;
        margin: 6px 0 12px;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
    }

    .umf {
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .btn {
        background: #111827;
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
        border: none;
        cursor: pointer;
    }

    .btn.secondary {
        background: #374151;
    }

    .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f3f4f6;
        margin-left: 6px;
        font-size: 12px;
    }

    .warn {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        padding: 10px;
        border-radius: 8px;
    }

    .ok {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        padding: 10px;
        border-radius: 8px;
    }



    .login-logo-section-top_st {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .login-logo-section-top_st .login-logo-section img {
        max-height: 50px;
        max-width: 100%;
        height: auto;
    }
    .login-logo-section-top_st .login-logo-section h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        font-size: 32px;
    }
    .login-logo-section {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .login-logo-section-top_st button {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        cursor: pointer;
        border-radius: 6px;
    }
    .header-bar {
        background-color: rgba(17, 17, 17, 0.8);
        padding: 15px 0;
        margin-bottom: 30px;
        border-bottom: 1px solid #333;
    }
    .container{
        max-width: 1200px;
        position: relative;
        z-index: 1;
        margin: 0 auto;
    }


    .form_main_set .row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: space-between;
        overflow: hidden;
        margin-bottom: 15px;
    }
    .form_main_set .row .inner_frm {
        width: 47%;
        display: inline-block;
        padding-right: 20px;
    }
    .form_main_set .row div input {
        width: 100%;
        display: block;
    }
    .login-logo-section-top_st_text p {
        font-size: 20px;
        max-width: 1200px;
        margin: 0 auto 30px;
        padding: 0;
        font-weight: 400;
    }
    .form_main_set .row div input {
        width: 100%;
        display: block;
        background-color: #000 !important;
        color: #fff !important;
        border: 1px solid #686868 !important;
        border-radius: 6px;
        line-height: 32px;
        color: #fff !important;
        font-family: "Montserrat", sans-serif;
    }
    .upload input{
        display: block;
        width: 100%;
        padding: 0;
        font-size: 15px;
        font-weight: 300;
    }
    .inner_frm.upload input {
        padding: 8px;
        margin: 6px 0 12px;
    }
    .form_main_set button {
        background-color: #f1c40f !important;
        color: #000 !important;
        font-weight: 600;
        border: none !important;
        padding: 12px 60px !important;
        font-size: 1.1rem !important;
        cursor: pointer;
        display: inline-block !important;
        visibility: visible !important;
        z-index: 10 !important;
        text-decoration: none !important;
        line-height: 1.5;
        font-family: 'Montserrat';
        border-radius: 6px;
    }
    .form_main_set {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 20px;
    }
    .form_main_set button:hover {
        background-color: #d4ac0d !important;
    }

    @media (max-width: 767px) {
        .login-logo-section {
            flex-wrap: wrap;
            gap: 8px;
        }
        .login-logo-section-top_st .login-logo-section img {
            max-height: 40px !important;
            margin-right: 0 !important;
        }
        .login-logo-section-top_st .login-logo-section h1 {
            font-size: 18px !important;
            font-weight: 600 !important;
        }
        .login-logo-section-top_st_text p {
            font-size: 18px;
        }
        .form_main_set .row .inner_frm {
            width: 100%;
            padding-right: 20px;
        }
        .form_main_set {
            padding: 0;
            padding-bottom: 10px;
        }
        .form_main_set button {
            display: block !important;
            width: 100%;
        }
    }
</style>
</head>

<body>
    <div class="header-bar">
        <div class="container">
            <div class="login-logo-section-top_st">
                <div class="login-logo-section">
                    <img src="https://www.ramoslaw.com/wp-content/uploads/2024/02/ramos-law-injury-intelligence-cross.webp"
                        alt="Ramos Law">
                    <h1>BriefWriter Prototype — MSJ Response (Non-Movant)</h1>
                    <!-- ACTIVE USERS BUTTON -->
                    <div style="position: relative; display: inline-block; margin-right: 10px;">
                        <button onclick="toggleActiveUsers()" style="
      background: #111;
      color: #f1c40f;
      border: 1px solid #f1c40f;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
    ">
                            <span style="color: #2ecc71">●</span>
                            <span id="active-user-count">0</span> Active Users
                        </button>

                        <!-- ACTIVE USERS POPOVER -->
                        <div id="active-users-popover" style="
      position: absolute;
      top: 45px;
      right: 0;
      background-color: #1a1a1a;
      border: 1px solid rgba(241, 196, 15, 0.4);
      border-radius: 8px;
      padding: 12px;
      min-width: 220px;
      display: none;
      z-index: 3000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    ">
                            <div style="
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(241, 196, 15, 0.3);
        font-size: 12px;
        font-weight: 600;
      ">
                                Active Users
                            </div>

                            <div id="active-users-list"></div>
                        </div>
                    </div>
                    <!-- Refresh Button -->
                    <button onclick="refreshActiveUsers()" style="
      background: #111;
      color: #f1c40f;
      border: 1px solid #f1c40f;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
    " title="Refresh active users">
                        ⟲
                    </button>

                </div>
                <div style="text-align: right;">
                    <button onclick="
  localStorage.removeItem('briefwriter_token');
  localStorage.removeItem('briefwriter_email');
  window.dispatchEvent(new Event('logout-success'));
  window.location.href = '/briefwriter';
">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="login-logo-section-top_st_text">
        <p>Upload the <strong>Motion for Summary Judgment</strong> (PDF or TXT). We’ll extract numbered UMFs, then you can mark disputes, add cites, and generate a DOCX draft.</p>
    </div>
    <form id="ingestForm" enctype="multipart/form-data" class="form_main_set">
        <div class="row">
            <div class="inner_frm">
                <label>Case Caption</label>
                <input type="text" name="case_caption" placeholder="Jane Doe v. Acme Corp., No. 1:24-cv-1234 (D. Colo.)">
            </div>
            <div class="inner_frm">
                <label>Jurisdiction</label>
                <input type="text" name="jurisdiction" placeholder="D. Colo.">
            </div>
        </div>

        <div class="row">
            <div class="inner_frm">
                <label>Requested Relief</label>
                <input type="text" name="requested_relief" placeholder="deny the Motion for Summary Judgment">
            </div>
            <div class="inner_frm">
                <label>Rule Citation</label>
                <input type="text" name="rule_citation" placeholder="Fed. R. Civ. P. 56; Celotex; Anderson">
            </div>
        </div>
        <div class="row">
            <div class="inner_frm">
                <label>Key Authorities</label>
                <input type="text" name="key_authorities" placeholder="Celotex, Anderson, Tolan">
            </div>

            <div class="inner_frm upload">
                <label>Upload Motion (PDF or TXT)</label>
                <input type="file" name="motion" required>
            </div>
        </div>
        <button class="btn" type="submit">Ingest & Extract UMFs</button>
    </form>
    <script>
        document.getElementById("ingestForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const fileInput = document.querySelector('input[name="motion"]');

            if (!fileInput.files.length) {
                alert("Please upload a motion file before submitting.");
                return;
            }

            const token = localStorage.getItem("briefwriter_token");

            if (!token) {
                window.location.href = "/briefwriter";
            }

            // document.getElementById("ingestForm").addEventListener("submit", async (e) => {
            //     e.preventDefault();

            const formData = new FormData(e.target);

            const res = await fetch("/briefwriter/ingest", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token
                },
                body: formData
            });

            if (res.redirected) {
                window.location.href = res.url;
            } else {
                alert(await res.text());
            }
        });
    </script>

    <script>
        const API_BASE_URL = "";

        // Check token on page load
        if (!localStorage.getItem("briefwriter_token")) {
            window.location.href = "/briefwriter";
        }

        function toggleActiveUsers() {
            const popover = document.getElementById("active-users-popover");
            popover.style.display =
                popover.style.display === "block" ? "none" : "block";
        }

        function refreshActiveUsers() {
            loadActiveUsers();
        }

        async function loadActiveUsers() {
            try {
                const token = localStorage.getItem("briefwriter_token");
                if (!token) return;

                const res = await fetch(API_BASE_URL + "/briefwriter/active-today", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token,
                        "ngrok-skip-browser-warning": "true"
                    }
                });

                if (!res.ok) return;

                const users = await res.json();

                document.getElementById("active-user-count").innerText = users.length;

                const list = document.getElementById("active-users-list");
                list.innerHTML = "";

                if (users.length === 0) {
                    list.innerHTML =
                        "<p style='color:#aaa; font-size:13px'>No active users</p>";
                    return;
                }

                users.forEach((user) => {
                    const div = document.createElement("div");
                    div.style.padding = "10px 8px";
                    div.style.fontSize = "13px";
                    div.style.borderBottom = "1px solid #333";
                    div.style.color = "#ddd";
                    div.style.display = "flex";
                    div.style.justifyContent = "space-between";
                    div.style.alignItems = "center";
                    div.style.gap = "16px";
                    
                    const emailSpan = document.createElement("span");
                    emailSpan.style.color = "#f1c40f";
                    emailSpan.style.fontWeight = "500";
                    emailSpan.style.flex = "1";
                    emailSpan.innerText = user.email || user;
                    
                    const timeSpan = document.createElement("span");
                    timeSpan.style.color = "#aaa";
                    timeSpan.style.fontSize = "12px";
                    timeSpan.style.whiteSpace = "nowrap";
                    timeSpan.style.flexShrink = "0";
                    const timeText = user.last_active ? formatLastActive(user.last_active) : "unknown";
                    timeSpan.innerText = timeText;
                    
                    div.appendChild(emailSpan);
                    div.appendChild(timeSpan);
                    list.appendChild(div);
                });
            } catch (err) {
                console.error("Active users fetch failed", err);
            }
        }

        function formatLastActive(dateStr) {
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return "just now";
                if (diffMins < 60) return `${diffMins}m ago`;
                if (diffHours < 24) return `${diffHours}h ago`;
                return `${diffDays}d ago`;
            } catch (e) {
                return "";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadActiveUsers();
        });

        // Check token when page is shown (including back button)
        window.addEventListener("pageshow", () => {
            if (!localStorage.getItem("briefwriter_token")) {
                window.location.href = "/briefwriter";
            }
        });

        window.addEventListener("logout-success", () => {
            document.getElementById("active-user-count").innerText = "0";
            document.getElementById("active-users-popover").style.display = "none";
        });

        document.addEventListener("click", function (e) {
            const popover = document.getElementById("active-users-popover");
            if (!popover) return;
            if (!popover.contains(e.target) && !e.target.closest("button")) {
                popover.style.display = "none";
            }
        });
    </script>

</body>

</html>
