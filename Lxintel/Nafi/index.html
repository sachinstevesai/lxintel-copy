<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramos Law NAFI Case Screen</title>
    <link
      rel="icon"
      type="image/webp"
      href="https://www.ramoslaw.com/wp-content/uploads/2024/02/ramos-law-injury-intelligence-cross.webp"
    />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        font-family: "Montserrat", sans-serif;
        background-color: #111;
        color: #f1c40f;
        height: 100vh;
        overflow: hidden;
      }

      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
        z-index: 1;
      }

      .app-header {
        background: rgba(17, 17, 17, 0.98);
        backdrop-filter: blur(20px);
        border-bottom: 2px solid rgba(241, 196, 15, 0.2);
        padding: 20px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 20px rgba(241, 196, 15, 0.15);
        position: relative;
        z-index: 2000;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .logo {
        height: 56px;
        width: auto;
        filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.3));
      }

      .header-title h1 {
        font-size: 24px;
        font-weight: 700;
        color: #f1c40f;
        letter-spacing: 1px;
        text-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
      }

      .header-title p {
        font-size: 13px;
        color: #999;
        margin-top: 4px;
      }

      .header-right {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .new-chat-btn {
        background: rgba(241, 196, 15, 0.15);
        color: #f1c40f;
        border: 1px solid rgba(241, 196, 15, 0.4);
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .new-chat-btn:hover {
        background: rgba(241, 196, 15, 0.25);
        border-color: rgba(241, 196, 15, 0.6);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
      }

      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        max-width: 100%;
        width: 100%;
        margin: 0 auto;
        padding: 0 24px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 32px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .chat-messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(241, 196, 15, 0.4);
        border-radius: 4px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background: rgba(241, 196, 15, 0.6);
      }

      .message-wrapper {
        display: flex;
        animation: slideUp 0.4s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-wrapper.user {
        justify-content: flex-end;
      }

      .message {
        max-width: 75%;
        padding: 18px 24px;
        border-radius: 16px;
        line-height: 1.7;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .message.user {
        background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%);
        color: #000;
        border-bottom-right-radius: 4px;
        font-weight: 500;
      }

      .message.assistant {
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(10px);
        color: #e0e0e0;
        border: 1px solid rgba(241, 196, 15, 0.2);
        border-bottom-left-radius: 4px;
        position: relative;
      }

      .auth-intro-box {
        background: #1a1a1a;
        border: none;
        border-radius: 12px;
        padding: 2.5rem;
        text-align: center;
      }

      .auth-intro-title {
        font-size: 2rem;
        font-weight: 800;
        color: #f1c40f;
        margin: 0 0 1rem 0;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .auth-intro-text {
        font-size: 1rem;
        color: #aaa;
        margin: 0 0 2rem 0;
        line-height: 1.6;
      }

      .auth-intro-email {
        color: #f1c40f;
        font-weight: 700;
      }

      .auth-primary-btn {
        width: 100%;
        padding: 0.875rem;
        font-size: 1rem;
        font-weight: 700;
        background-color: #d4ac0d;
        color: #000;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .auth-primary-btn:hover:not(:disabled) {
        background-color: #f1c40f;
        box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
      }

      .auth-primary-btn:disabled {
        background-color: #666;
        cursor: not-allowed;
        opacity: 0.6;
      }

      /* Feedback buttons */
      .feedback-buttons {
        position: absolute;
        left: 8px;
        bottom: 2px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .feedback-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(241, 196, 15, 0.15);
        color: #f1c40f;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .feedback-response {
        font-size: 12px;
        color: #f1c40f;
        margin-top: 6px;
        padding-left: 4px;
      }

      .feedback-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(241, 196, 15, 0.06);
      }

      .feedback-btn.disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }

      .message.assistant h3 {
        color: #f1c40f;
        font-weight: 700;
        font-size: 17px;
        margin: 16px 0 10px 0;
        padding-bottom: 8px;
        border-bottom: 2px solid rgba(241, 196, 15, 0.4);
      }

      .message.assistant h3:first-child {
        margin-top: 0;
      }

      .message.assistant hr {
        border: none;
        border-top: 1px solid rgba(241, 196, 15, 0.3);
        margin: 16px 0;
      }

      .message.assistant table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .message.assistant th,
      .message.assistant td {
        border: 1px solid rgba(241, 196, 15, 0.2);
        padding: 12px 14px;
        text-align: left;
      }

      .message.assistant th {
        background: rgba(241, 196, 15, 0.2);
        color: #f1c40f;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
      }

      .message.assistant tbody tr:hover {
        background: rgba(241, 196, 15, 0.05);
      }

      .message.assistant ul,
      .message.assistant ol {
        margin: 12px 0;
        padding-left: 24px;
        color: #e0e0e0;
      }

      .message.assistant li {
        margin: 6px 0;
      }

      .message.assistant strong {
        color: #f1c40f;
        font-weight: 700;
      }

      .message.assistant p {
        margin: 8px 0;
        color: #e0e0e0;
      }

      .message.assistant code {
        background: rgba(241, 196, 15, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        color: #f1c40f;
        border: 1px solid rgba(241, 196, 15, 0.3);
      }

      .message.assistant.welcome .welcome-content {
        max-height: 8.1rem;
        overflow-y: auto;
        padding-right: 8px;
        white-space: pre-line;
      }

      .message.assistant.welcome .welcome-content::-webkit-scrollbar {
        width: 8px;
      }

      .message.assistant.welcome .welcome-content::-webkit-scrollbar-thumb {
        background: rgba(241, 196, 15, 0.25);
        border-radius: 4px;
      }

      .typing-wrapper {
        display: flex;
      }

      .typing-indicator {
        display: none;
        padding: 18px 24px;
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(241, 196, 15, 0.2);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .typing-indicator.active {
        display: block;
      }

      .typing-dots {
        display: flex;
        gap: 5px;
      }

      .typing-dots span {
        width: 10px;
        height: 10px;
        background: #f1c40f;
        border-radius: 50%;
        animation: typing 1.4s infinite;
        box-shadow: 0 0 8px rgba(241, 196, 15, 0.5);
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }

        30% {
          transform: translateY(-10px);
          opacity: 1;
        }
      }

      /* Input Area */
      .input-container {
        background: rgba(17, 17, 17, 0.98);
        backdrop-filter: blur(20px);
        border-top: 2px solid rgba(241, 196, 15, 0.2);
        padding: 24px 32px;
        box-shadow: 0 -4px 20px rgba(241, 196, 15, 0.1);
      }

      .input-wrapper {
        max-width: 100%;
        margin: 0 auto;
        display: flex;
        gap: 16px;
        align-items: flex-end;
        align-items: center;
      }

      .input-wrapper textarea {
        flex: 1;
        min-height: auto;
        max-height: 200px;
        padding: 8px 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(241, 196, 15, 0.3);
        color: #f1c40f;
        resize: none;
        font-family: "Montserrat", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        transition: all 0.3s;
      }

      .input-wrapper textarea:focus {
        outline: none;
        border-color: rgba(241, 196, 15, 0.6);
        background: rgba(0, 0, 0, 0.8);
        box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
      }

      .input-wrapper textarea::placeholder {
        color: #666;
      }

      .send-btn {
        background: linear-gradient(135deg, #f1c40f 0%, #d4ac0d 100%);
        color: #000;
        border: none;
        padding: 19px 25px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 16px rgba(241, 196, 15, 0.4);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .send-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 24px rgba(241, 196, 15, 0.6);
        background: linear-gradient(135deg, #ffd93d 0%, #f1c40f 100%);
      }

      .send-btn:active {
        transform: translateY(-1px);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 16px rgba(241, 196, 15, 0.2);
      }

      .spinner {
        border: 3px solid rgba(0, 0, 0, 0.3);
        border-top-color: #000;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .app-header {
          padding: 16px 20px;
        }

        .header-title h1 {
          font-size: 18px;
        }

        .header-title p {
          display: none;
        }

        .logo {
          height: 44px;
        }

        .message {
          max-width: 85%;
        }

        .chat-container {
          padding: 0 16px;
        }
      }

      /* LOGIN PAGE STYLES */
      .login-page-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .login-page-content {
        width: 100%;
        max-width: 600px;
        padding: 2rem;
        text-align: center;
      }

      .login-logo-section {
        margin-bottom: 3rem;
      }

      .login-page-content h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #f1c40f;
        margin: 0 0 1rem 0;
        letter-spacing: 2px;
      }

      .login-page-content > p {
        font-size: 1rem;
        color: #aaa;
        margin: 0 0 2rem 0;
      }

      .login-form-card {
        background-color: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 2.5rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .login-form-card h2 {
        font-size: 2.5rem;
        font-weight: 800;
        color: #f1c40f;
        margin: 0 0 2rem 0;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .login-form-group {
        margin-bottom: 2rem;
        text-align: left;
      }

      .login-form-group label {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        color: #f1c40f;
        margin-bottom: 0.75rem;
      }

      .login-form-group input[type="email"] {
        width: 100%;
        padding: 0.875rem 1rem;
        font-size: 0.95rem;
        background-color: #000;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        font-family: "Montserrat", sans-serif;
        transition: border-color 0.3s ease;
      }

      .login-form-group input[type="email"]:focus {
        outline: none;
        border-color: #f1c40f;
        box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.1);
      }

      .login-form-group input[type="email"]::placeholder {
        color: #666;
      }

      .login-error-message {
        color: #e74c3c;
        background-color: rgba(231, 76, 60, 0.1);
        border: 1px solid rgba(231, 76, 60, 0.3);
        padding: 0.75rem 1rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        text-align: center;
      }

      .login-btn {
        width: 100%;
        padding: 0.875rem;
        font-size: 1rem;
        font-weight: 700;
        background-color: #d4ac0d;
        color: #000;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .login-btn:hover:not(:disabled) {
        background-color: #f1c40f;
        box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
      }

      .login-btn:disabled {
        background-color: #666;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .login-btn-spinner {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .active_user {
        position: fixed;
        top: 80px;
        left: 350px;
        background-color: rgb(26, 26, 26);
        border: 1px solid rgba(241, 196, 15, 0.4);
        border-radius: 8px;
        padding: 12px;
        min-width: auto;
        min-height: auto;
        max-height: 400px;
        display: none;
        z-index: 2100;
        box-shadow: rgba(0, 0, 0, 0.5) 0px 4px 20px;
        overflow-y: auto;
      }

      @keyframes pulse {
        0% {
          opacity: 0.6;
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0.6;
        }
      }

      @media (max-width: 768px) {
        .app-header {
          padding: 12px 16px !important;
        }

        .header-left {
          gap: 8px !important;
          flex-wrap: wrap;
        }

        .header-title h1 {
          font-size: 16px !important;
          letter-spacing: 0.5px !important;
        }

        .header-right {
          gap: 6px !important;
        }

        button.new-chat-btn {
          padding: 8px 10px !important;
          font-size: 11px !important;
          gap: 4px !important;
          border-radius: 4px !important;
        }

        .logo {
          height: 40px !important;
        }

        .active_user {
          left: 10px !important;
          right: 10px !important;
          top: 130px !important;
          max-width: calc(100vw - 20px) !important;
        }

        .chat-container {
          padding: 0 12px !important;
        }

        .chat-messages {
          padding: 20px 10px !important;
          gap: 16px !important;
        }

        .message {
          max-width: 92% !important;
          padding: 14px 18px !important;
          font-size: 14px !important;
        }

        .nafi-field-row {
          flex-direction: column !important;
          gap: 2px !important;
        }

        .nafi-field-label {
          min-width: 0 !important;
          font-size: 11px !important;
          opacity: 0.8;
        }

        .nafi-field-value {
          font-size: 14px !important;
        }

        .nafi-card-header {
          font-size: 14px !important;
          padding: 10px 14px !important;
        }

        .nafi-card-body {
          padding: 12px 14px !important;
        }

        .input-container {
          padding: 16px 12px !important;
        }

        .input-wrapper {
          gap: 8px !important;
        }

        .input-wrapper textarea {
          padding: 8px 12px !important;
          font-size: 14px !important;
          border-radius: 10px !important;
        }

        .send-btn {
          padding: 12px 16px !important;
          font-size: 13px !important;
          border-radius: 10px !important;
          letter-spacing: 0.5px !important;
        }
      }

      @media (max-width: 480px) {
        .header-title h1 {
          font-size: 14px !important;
        }

        .header-right {
          gap: 4px !important;
        }

        .header-right button span {
          display: none !important;
        }

        .header-right button {
          padding: 10px !important;
        }
      }

      div#user-menu-popover {
        top: 120px !important;
      }

      /* NAFI response card */
      .nafi-response-card {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(241, 196, 15, 0.2);
        font-size: 14px;
        line-height: 1.6;
      }

      .nafi-response-card.nafi-more-info {
        border-color: rgba(241, 196, 15, 0.5);
        background: rgba(241, 196, 15, 0.06);
      }

      .nafi-response-card.nafi-likely {
        border-color: rgba(231, 76, 60, 0.5);
        background: rgba(231, 76, 60, 0.06);
      }

      .nafi-response-card.nafi-not {
        border-color: rgba(46, 204, 113, 0.5);
        background: rgba(46, 204, 113, 0.06);
      }

      .nafi-card-header {
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nafi-more-info .nafi-card-header {
        background: rgba(241, 196, 15, 0.15);
        color: #f1c40f;
      }

      .nafi-likely .nafi-card-header {
        background: rgba(231, 76, 60, 0.15);
        color: #e74c3c;
      }

      .nafi-not .nafi-card-header {
        background: rgba(46, 204, 113, 0.15);
        color: #2ecc71;
      }

      .nafi-card-body {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nafi-field-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .nafi-field-label {
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
        padding-top: 2px;
        min-width: 90px;
      }

      .nafi-more-info .nafi-field-label {
        color: #f1c40f;
      }

      .nafi-likely .nafi-field-label {
        color: #e74c3c;
      }

      .nafi-not .nafi-field-label {
        color: #2ecc71;
      }

      .nafi-field-value {
        color: #e0e0e0;
      }

      .nafi-questions-section {
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid rgba(241, 196, 15, 0.2);
      }

      .nafi-questions-title {
        font-weight: 700;
        color: #f1c40f;
        font-size: 13px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .nafi-question-item {
        padding: 6px 12px;
        margin-bottom: 6px;
        background: rgba(241, 196, 15, 0.08);
        border: 1px solid rgba(241, 196, 15, 0.2);
        border-radius: 6px;
        color: #e0e0e0;
        font-size: 13px;
      }

      /* NAFI Tutorial UI */
      .nafi-tutorial-card {
        border-radius: 12px;
        overflow: hidden;

    <script>
      const Translator = {
        cache: new Map(),
        async translate(text, targetLang) {
          if (!text || targetLang === "en") return text;
          const cacheKey = `${targetLang}:${text}`;
          if (this.cache.has(cacheKey)) return this.cache.get(cacheKey);

          try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();
            let translatedText = "";
            if (data && data[0]) {
              translatedText = data[0].map((x) => x[0]).join("");
            } else {
              translatedText = text;
            }
            this.cache.set(cacheKey, translatedText);
            return translatedText;
          } catch (e) {
            console.error("Translation error", e);
            return text;
          }
        },
      };

      window.currentLang = localStorage.getItem("appLang") || "en";

      async function applyTranslations(lang) {
        document.querySelectorAll("[data-i18n]").forEach(async (el) => {
          if (el.dataset.originalTranslationText === undefined) {
            el.dataset.originalTranslationText = el.textContent;
          }
          el.textContent = await Translator.translate(
            el.dataset.originalTranslationText,
            lang,
          );
        });

        document
          .querySelectorAll("[data-i18n-placeholder]")
          .forEach(async (el) => {
            if (el.dataset.originalTranslationPlaceholder === undefined) {
              el.dataset.originalTranslationPlaceholder = el.placeholder;
            }
            el.placeholder = await Translator.translate(
              el.dataset.originalTranslationPlaceholder,
              lang,
            );
          });

        document.querySelectorAll("[data-i18n-title]").forEach(async (el) => {
          if (el.dataset.originalTranslationTitle === undefined) {
            el.dataset.originalTranslationTitle = el.title;
          }
          el.title = await Translator.translate(
            el.dataset.originalTranslationTitle,
            lang,
          );
        });

        document
          .querySelectorAll(".translateable-message")
          .forEach(async (msg) => {
            const raw = msg.dataset.originalContent;
            if (!raw) return;
            const translatedRaw = await Translator.translate(raw, lang);
            const bodyDiv = msg.querySelector(".message-body");
            if (bodyDiv) {
              if (
                msg.classList.contains("assistant") &&
                !msg.classList.contains("welcome")
              ) {
                let processed =
                  typeof processTableContent === "function"
                    ? processTableContent(translatedRaw)
                    : translatedRaw;
                bodyDiv.innerHTML = marked.parse(processed);
                bodyDiv.querySelectorAll("a").forEach((link) => {
                  link.setAttribute("target", "_blank");
                  link.setAttribute("rel", "noopener noreferrer");
                });
              } else {
                bodyDiv.textContent = translatedRaw;
              }
            }
          });
      }

      async function changeLanguage(lang) {
        window.currentLang = lang;
        localStorage.setItem("appLang", lang);
        await applyTranslations(lang);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const sel = document.getElementById("lang-selector");
        if (sel) sel.value = window.currentLang;
        applyTranslations(window.currentLang);
      });
    </script>

      async function sendFeedback(prompt_log_id, feedback, upBtn, downBtn) {
        try {
          upBtn.classList.add("disabled");
          downBtn.classList.add("disabled");

          const resp = await fetch(
            API_BASE_URL + "/ramoslaw_chatgpt/chat/feedback",

              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${localStorage.getItem("jwtsopchatbot")}`,
                "ngrok-skip-browser-warning": "true",
              },
              body: JSON.stringify({
                prompt_log_id: String(prompt_log_id),
                feedback,
              }),
            },
          );

          if (!resp.ok) {
            upBtn.classList.remove("disabled");
            downBtn.classList.remove("disabled");
            upBtn.disabled = false;
            downBtn.disabled = false;
            return;
          }

          let json = {};
          try {
            json = await resp.json();
          } catch (e) {
            json = {};
          }
          const respText = json.message;

          upBtn.classList.add("disabled");
          downBtn.classList.add("disabled");
          upBtn.disabled = true;
          downBtn.disabled = true;

          if (feedback === "up") {
            upBtn.style.background = "rgba(46, 204, 113, 0.12)";
            upBtn.style.borderColor = "rgba(46, 204, 113, 0.25)";

            downBtn.style.background = "rgba(231, 76, 60, 0.08)";
            downBtn.style.borderColor = "rgba(231, 76, 60, 0.2)";

          const fbContainer = upBtn.parentElement;
          if (fbContainer) {
            let existing = fbContainer.querySelector(".feedback-response");
            if (!existing) {
              existing = document.createElement("div");
              existing.className = "feedback-response";
              fbContainer.appendChild(existing);
            }
            existing.textContent = respText;
          }
        } catch (err) {
          upBtn.classList.remove("disabled");
          downBtn.classList.remove("disabled");
          console.error("Feedback error", err);
        }
      }

      function processTableContent(content) {
        const lines = content.split("\n");
        let processedContent = [];
        let i = 0;

        while (i < lines.length) {
          let line = lines[i].trim();

          if (line.startsWith("|") && line.endsWith("|")) {
            const tableLines = [];
            while (i < lines.length && lines[i].trim().startsWith("|")) {
              const tableLine = lines[i].trim();
              if (tableLine.length > 0) {
                tableLines.push(tableLine);
              }
              i++;
            }

            if (tableLines.length > 0) {
              const markdownTable = convertToMarkdownTable(tableLines);
              processedContent.push(markdownTable);
            }
            continue;
          }

          processedContent.push(line);
          i++;
        }

        return processedContent.join("\n");
      }

      function convertToMarkdownTable(tableLines) {
        const rows = tableLines.map((line) => {
          const cells = line
            .slice(1, -1)
            .split("|")
            .map((cell) => cell.trim());
          return cells;
        });

        if (rows.length === 0) return "";

        let separatorIndex = rows.findIndex((row) =>
          row.every((cell) => /^[\s\-]+$/.test(cell) || cell === ""),
        );

        let headerRow, dataRows;

        if (separatorIndex !== -1) {
          headerRow = rows[0];
          dataRows = rows
            .slice(1)
            .filter((_, idx) => idx !== separatorIndex - 1);
        } else {
          headerRow = rows[0];
          dataRows = rows.slice(1);
        }

        const numCols = Math.max(
          headerRow.length,
          ...dataRows.map((row) => row.length),
        );

        while (headerRow.length < numCols) {
          headerRow.push("");
        }

        dataRows = dataRows.map((row) => {
          const newRow = [...row];
          while (newRow.length < numCols) newRow.push("");
          return newRow;
        });

        let markdown = "\n\n";
        markdown += "| " + headerRow.join(" | ") + " |\n";
        markdown += "| " + headerRow.map(() => "---").join(" | ") + " |\n";
        dataRows.forEach((row) => {
          markdown += "| " + row.join(" | ") + " |\n";
        });
        markdown += "\n";

        return markdown;
      }

      function scrollToBottom() {
        const messagesDiv = document.getElementById("chat-messages");
        setTimeout(() => {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 100);

      // Alpine.js Components
      function loginApp() {
        return {
          authStep: "email",
          email: "",
          emailChecking: false,
          passwordCreated: false,
          error: "",
          successMsg: "",
          password: "",
          loggingIn: false,
          showPw: false,
          otpDigits: ["", "", "", "", "", ""],
          otpVerifying: false,
          otpSending: false,
          loadingText: "",
          newPassword: "",
          confirmPassword: "",
          showPw2: false,
          creatingPw: false,
          forgotOtpDigits: ["", "", "", "", "", ""],
          resetNewPassword: "",
          resettingPw: false,
          resendCooldown: 0,
          _resendTimer: null,

          _headers() {
            return {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            };
          },

          goBackToEmail() {
            this.authStep = "email";
            this.error = "";
            this.successMsg = "";
            this.password = "";
            this.newPassword = "";
            this.confirmPassword = "";
            this.resetNewPassword = "";
            this.otpDigits = ["", "", "", "", "", ""];
            this.forgotOtpDigits = ["", "", "", "", "", ""];
            this.showPw = false;
            this.showPw2 = false;
          },

          handleOtpInput(event, index, groupId) {
            const val = event.target.value.replace(/\D/g, "");
            if (this.authStep === "set_otp") {
              this.otpDigits[index] = val.charAt(0) || "";
            } else {
              this.forgotOtpDigits[index] = val.charAt(0) || "";
            }
            event.target.value = val.charAt(0) || "";
            if (val && index < 5) {
              const group = document.getElementById(groupId);
              if (group) {
                const inputs = group.querySelectorAll("input");
                if (inputs[index + 1]) inputs[index + 1].focus();
              }
            }
          },

          handleOtpBackspace(event, index, groupId) {
            if (!event.target.value && index > 0) {
              const group = document.getElementById(groupId);
              if (group) {
                const inputs = group.querySelectorAll("input");
                if (inputs[index - 1]) inputs[index - 1].focus();
              }
            }
          },

          handleOtpPaste(event) {
            const text = (event.clipboardData || window.clipboardData)
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 6);
            for (let i = 0; i < 6; i++) {
              this.otpDigits[i] = text[i] || "";
            }
            this.$nextTick(() => {
              const group = document.getElementById("set-otp-group");
              if (group) {
                const inputs = group.querySelectorAll("input");
                inputs.forEach((inp, i) => (inp.value = this.otpDigits[i]));
              }
            });
          },

          handleForgotOtpPaste(event) {
            const text = (event.clipboardData || window.clipboardData)
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 6);
            for (let i = 0; i < 6; i++) {
              this.forgotOtpDigits[i] = text[i] || "";
            }
            this.$nextTick(() => {
              const group = document.getElementById("forgot-otp-group");
              if (group) {
                const inputs = group.querySelectorAll("input");
                inputs.forEach(
                  (inp, i) => (inp.value = this.forgotOtpDigits[i]),
                );
              }
            });
          },

          startResendCooldown() {
            this.resendCooldown = 30;
            if (this._resendTimer) clearInterval(this._resendTimer);
            this._resendTimer = setInterval(() => {
              this.resendCooldown--;
              if (this.resendCooldown <= 0) clearInterval(this._resendTimer);
            }, 1000);
          },

          async verifyEmail() {
            if (!this.email || !this.email.includes("@")) {
              this.error = "Please enter a valid email";
              return;
            }
            this.emailChecking = true;
            this.error = "";
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/verify-email?email=${encodeURIComponent(this.email)}`,
                { method: "GET", headers: this._headers() },
              );
              const json = await res.json();
              if (!json.valid) {
                this.error =
                  "Access denied: Your email is not on the authorized list.";
                this.emailChecking = false;
                return;
              }
              this.passwordCreated = json.password_created === true;
              if (this.passwordCreated) {
                this.authStep = "login";
              } else {
                this.error = "";
                this.successMsg = "";
                this.authStep = "set_intro";
              }
            } catch (err) {
              this.error =
                "Access denied: Your email is not on the authorized list.";
            } finally {
              this.emailChecking = false;
            }
          },

          async login() {
            if (!this.password) {
              this.error = "Please enter your password";
              return;
            }
            this.loggingIn = true;
            this.error = "";
            this.successMsg = "";
            try {
              const body = new URLSearchParams();
              body.append("username", this.email);
              body.append("password", this.password);
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/login`,
                {
                  method: "POST",
                  body,
                  headers: { "ngrok-skip-browser-warning": "true" },
                },
              );
              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.detail || "Invalid credentials");
              }
              const json = await res.json();
              localStorage.setItem("jwtsopchatbot", json.access_token);
              localStorage.setItem("playbookEmail", this.email);
              this.error = "";
              window.dispatchEvent(
                new CustomEvent("login-success", {
                  detail: { email: this.email },
                }),
              );
            } catch (err) {
              this.error = err.message || "Invalid credentials";
            } finally {
              this.loggingIn = false;
            }
          },

          async startSetupOtp() {
            this.error = "";
            this.otpSending = true;
            this.loadingText = "Sending verification code...";

            try {
              await this._sendSetupOtp();
              this.authStep = "set_otp";
            } catch (err) {
              this.error = err.message || "Failed to send OTP";
            } finally {
              this.otpSending = false;
            }
          },

          async _sendSetupOtp() {
            this.loadingText = "Sending verification code...";
            this.otpSending = true;
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/send/otp?email=${encodeURIComponent(this.email)}`,
                { method: "POST", headers: this._headers() },
              );
              const json = await res.json();
              if (!res.ok) throw new Error(json.detail || "Failed to send OTP");
              this.startResendCooldown();
            } catch (err) {
              this.error = err.message || "Failed to send OTP";
            } finally {
              this.otpSending = false;
            }
          },

          async verifySetOtp() {
            const otp = this.otpDigits.join("");
            if (otp.length < 6) {
              this.error = "Please enter the full 6-digit code";
              return;
            }
            this.otpVerifying = true;
            this.error = "";
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/verify/otp?email=${encodeURIComponent(this.email)}&otp=${encodeURIComponent(otp)}`,
                { method: "POST", headers: this._headers() },
              );
              const json = await res.json();
              if (!res.ok) throw new Error(json.detail || "Invalid OTP");
              this.authStep = "set_password";
            } catch (err) {
              this.error = err.message || "Invalid OTP";
            } finally {
              this.otpVerifying = false;
            }
          },

          async createPassword() {
            if (this.newPassword !== this.confirmPassword) {
              this.error = "Passwords do not match";
              return;
            }
            if (this.newPassword.length < 4) {
              this.error = "Password is too short";
              return;
            }
            this.creatingPw = true;
            this.error = "";
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/create/password?email=${encodeURIComponent(this.email)}&password=${encodeURIComponent(this.newPassword)}`,
                { method: "POST", headers: this._headers() },
              );
              const json = await res.json();
              if (!res.ok)
                throw new Error(json.detail || "Failed to create password");
              this.password = this.newPassword;
              this.successMsg = "Password created! Logging you in...";
              this.authStep = "login";
              this.$nextTick(() => this.login());
            } catch (err) {
              this.error = err.message || "Failed to create password";
            } finally {
              this.creatingPw = false;
            }
          },

          async startForgotPassword() {
            this.error = "";
            this.successMsg = "";
            this.forgotOtpDigits = ["", "", "", "", "", ""];
            this.resetNewPassword = "";
            this.showPw = false;
            this.loadingText = "Sending reset code...";
            this.otpSending = true;
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/forgot/password?email=${encodeURIComponent(this.email)}`,
                { method: "POST", headers: this._headers() },
              );
              const json = await res.json();
              if (!res.ok)
                throw new Error(json.detail || "Failed to send reset code");
              this.authStep = "forgot_otp";
              this.startResendCooldown();
            } catch (err) {
              this.error = err.message || "Failed to send reset code";
            } finally {
              this.otpSending = false;
            }
          },

          async resetPassword() {
            const otp = this.forgotOtpDigits.join("");
            if (otp.length < 6) {
              this.error = "Please enter the full 6-digit code";
              return;
            }
            if (!this.resetNewPassword) {
              this.error = "Please enter a new password";
              return;
            }
            this.resettingPw = true;
            this.error = "";
            try {
              const res = await fetch(
                `${API_BASE_URL}/ramoslaw_chatgpt/reset/password?email=${encodeURIComponent(this.email)}&otp=${encodeURIComponent(otp)}&new_password=${encodeURIComponent(this.resetNewPassword)}`,
                { method: "POST", headers: this._headers() },
              );
              const json = await res.json();
              if (!res.ok)
                throw new Error(json.detail || "Failed to reset password");
              this.password = this.resetNewPassword;
              this.successMsg = "Password reset successful! Please log in.";
              this.authStep = "login";
            } catch (err) {
              this.error = err.message || "Failed to reset password";
            } finally {
              this.resettingPw = false;
            }
          },

          async resendOtp(type) {
            if (this.resendCooldown > 0) return;
            this.error = "";
            if (type === "set") {
              await this._sendSetupOtp();
            } else {
              this.loadingText = "Resending reset code...";
              this.otpSending = true;
              try {
                const res = await fetch(
                  `${API_BASE_URL}/ramoslaw_chatgpt/forgot/password?email=${encodeURIComponent(this.email)}`,
                  { method: "POST", headers: this._headers() },
                );
                const json = await res.json();
                if (!res.ok)
                  throw new Error(json.detail || "Failed to resend code");
                this.startResendCooldown();
              } catch (err) {
                this.error = err.message || "Failed to resend code";
              } finally {
                this.otpSending = false;
              }
            }
          },
        };
      }

      function sopApp() {
        return {
          isLoggedIn: false,
          userEmail: "",

          init() {
            this.checkAuth();
            window.addEventListener("login-success", (e) => {
              this.userEmail = e.detail.email;
              this.isLoggedIn = true;
            });
          },

          checkAuth() {
            const token = localStorage.getItem("jwtsopchatbot");
            const userEmail = localStorage.getItem("playbookEmail");
            if (token && userEmail) {
              this.isLoggedIn = true;
              this.userEmail = userEmail;
            }
          },

          logout() {
            localStorage.removeItem("jwtsopchatbot");
            localStorage.removeItem("playbookEmail");
            window.dispatchEvent(new Event("logout-success"));
          },
        };
      }
    </script>

    <script>
      // ============ NAFI CASE SCREEN ============

      function updateHeaderUI() {
        const closeTutorialBtn = document.getElementById(
          "close-tutorial-btn-header",
        );
        const tutorialBtn = document.getElementById("tutorial-btn-header");
        const newChatBtn = document.getElementById("new-chat-btn-header");
        const langSel = document.getElementById("lang-selector");
        const menuBtn = document.getElementById("user-menu-btn");

        if (closeTutorialBtn) {
          closeTutorialBtn.style.display = nafiTutorialActive ? "flex" : "none";
        }
        if (tutorialBtn) {
          tutorialBtn.style.display = nafiTutorialActive ? "none" : "flex";
        }
        if (newChatBtn) {
          newChatBtn.style.display = nafiTutorialActive ? "none" : "flex";
        }
      }

      async function startNafiChat() {
        nafiTutorialActive = false;
        nafiTutorialLastAnswer = null;
        nafiTutorialProcessing = false;

        const inputContainer = document.querySelector(".input-container");
        if (inputContainer) inputContainer.style.display = "block";

        currentMode = "nafi";
        updateHeaderUI();
        nafiLastIntakeDescription = "";
        nafiAwaitingFollowUp = false;

        const messagesDiv = document.getElementById("chat-messages");
        messagesDiv.innerHTML = "";
        document.getElementById("message-input").value = "";

        const input = document.getElementById("message-input");
        input.placeholder = await Translator.translate(
          "Enter your NAFI case details...",
          window.currentLang,
        );

        await addNafiWelcomeMessage();
      }

      async function addNafiWelcomeMessage() {
        const messagesDiv = document.getElementById("chat-messages");

        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper assistant";

        const messageDiv = document.createElement("div");
        messageDiv.className =
          "message assistant welcome translateable-message";
        const nafiText = `Describe the matter in clear, full sentences, as if you were briefly explaining it to an intake specialist. Include what happened, when it happened, who was involved, and what kind of injury, harm, or dispute is being reported. Avoid vague prompts, shorthand, jargon, and unexplained acronyms. The more specific your description, the more accurate the screening result will be.
Good example:
“The caller says she was injured in a rear-end crash last month, went to urgent care the same day, and now has neck and back pain.”
Avoid:
“MVA soft tissue”
“med mal?”
“WC issue”
“bad provider case”
Tip: If you are unsure about details, say that directly rather than guessing.`;

        messageDiv.dataset.originalContent = nafiText;

        const inner = document.createElement("div");
        inner.className = "welcome-content message-body";
        inner.textContent = await Translator.translate(
          nafiText,
          window.currentLang,
        );

        messageDiv.appendChild(inner);
        wrapper.appendChild(messageDiv);
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
      }

      // ============ NAFI TUTORIAL UI ============
      async function startNafiTutorial() {
        if (nafiTutorialProcessing) return;
        if (nafiTutorialActive) return;

        nafiTutorialActive = true;
        updateHeaderUI();
        nafiTutorialLastAnswer = null;
        nafiTutorialProcessing = true;
        let success = false;

        const tutorialBtn = document.getElementById("tutorial-btn-header");
        if (tutorialBtn) tutorialBtn.disabled = true;

        const inputContainer = document.querySelector(".input-container");
        if (inputContainer) inputContainer.style.display = "none";

        const messagesDiv = document.getElementById("chat-messages");
        messagesDiv.innerHTML = "";

        showTypingIndicator();
        try {
          const data = await callNafiTutorialApi({ action: "start" });
          await renderNafiTutorialStep(data);
          success = true;
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
        } finally {
          hideTypingIndicator();
          nafiTutorialProcessing = false;
          if (tutorialBtn) tutorialBtn.disabled = false;
          if (!success) {
            nafiTutorialActive = false;
            nafiTutorialLastAnswer = null;
            updateHeaderUI();
            if (inputContainer) inputContainer.style.display = "block";
          }
        }
      }

      async function closeNafiTutorial() {
        if (nafiTutorialProcessing) return;
        await startNafiChat();
      }

      async function callNafiTutorialApi(payload) {
        const response = await fetch(
          `${API_BASE_URL}/ramoslaw_chatgpt/chat/nafi/tutorial`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("jwtsopchatbot")}`,
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify(payload),
          },
        );

        if (!response.ok) {
          const text = await response.text().catch(() => "");
          throw new Error(
            `NAFI tutorial API failed (${response.status}) ${text}`,
          );
        }

        return await response.json();
      }

      async function renderNafiTutorialStep(data) {
        const messagesDiv = document.getElementById("chat-messages");

        let ui = document.getElementById("nafi-tutorial-ui");
        if (!ui) {
          ui = document.createElement("div");
          ui.id = "nafi-tutorial-ui";
          messagesDiv.appendChild(ui);
        }
        ui.innerHTML = "";

        const message = data?.message || "";
        const expectedFields = Array.isArray(data?.expected_fields)
          ? data.expected_fields
          : [];
        const needsFollowup = expectedFields.includes("followup_questions");

        const card = document.createElement("div");
        card.className = "nafi-tutorial-card";

        const messageDiv = document.createElement("div");
        messageDiv.className = "nafi-tutorial-message";
        messageDiv.textContent = await Translator.translate(
          message,
          window.currentLang,
        );
        card.appendChild(messageDiv);

        const isFinalScore = /Final\s*Score/i.test(message);
        if (isFinalScore) {
          ui.appendChild(card);
          scrollToBottom();
          return;
        }

        if (needsFollowup) {
          const options = [
            { value: "yes_nafi", label: "Nafi" },
            { value: "no_not_nafi", label: "Not Nafi" },
            { value: "more_info_needed", label: "More Info Needed" },
          ];

          const disabledSelectedValue =
            nafiTutorialLastAnswer || "more_info_needed";

          const optionsBlock = document.createElement("div");
          optionsBlock.className = "nafi-tutorial-options";

          options.forEach((opt) => {
            const row = document.createElement("label");
            row.className = "nafi-tutorial-option disabled";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "nafi-tutorial-answer";
            input.value = opt.value;
            input.disabled = true;
            if (opt.value === disabledSelectedValue) input.checked = true;

            const label = document.createElement("div");
            label.textContent = opt.label;

            row.appendChild(input);
            row.appendChild(label);
            optionsBlock.appendChild(row);
          });

          card.appendChild(optionsBlock);

          const actionRow = document.createElement("div");
          actionRow.className = "nafi-tutorial-action-row";

          const submitBtn = document.createElement("button");
          submitBtn.id = "nafi-tutorial-submit-btn";
          submitBtn.className = "nafi-tutorial-action-btn";
          submitBtn.disabled = true;
          submitBtn.textContent = "Submit";

          actionRow.appendChild(submitBtn);
          card.appendChild(actionRow);

          const followupsBlock = document.createElement("div");
          followupsBlock.className = "nafi-tutorial-followups";

          const q1Label = document.createElement("div");
          q1Label.className = "nafi-tutorial-followup-label";
          q1Label.textContent = "Question 1";

          const q1 = document.createElement("textarea");
          q1.id = "nafi-tutorial-followup-q1";
          q1.className = "nafi-tutorial-textarea";

          const q2Label = document.createElement("div");
          q2Label.className = "nafi-tutorial-followup-label";
          q2Label.textContent = "Question 2";

          const q2 = document.createElement("textarea");
          q2.id = "nafi-tutorial-followup-q2";
          q2.className = "nafi-tutorial-textarea";

          followupsBlock.appendChild(q1Label);
          followupsBlock.appendChild(q1);
          followupsBlock.appendChild(q2Label);
          followupsBlock.appendChild(q2);

          card.appendChild(followupsBlock);

          const saveRow = document.createElement("div");
          saveRow.className = "nafi-tutorial-action-row";

          const saveBtn = document.createElement("button");
          saveBtn.id = "nafi-tutorial-save-btn";
          saveBtn.className = "nafi-tutorial-action-btn";
          saveBtn.disabled = true;
          saveBtn.textContent = "Save Question";
          saveBtn.addEventListener("click", saveNafiTutorialFollowupQuestions);

          const updateSaveEnabled = () => {
            const q1Val = q1.value.trim();
            const q2Val = q2.value.trim();
            saveBtn.disabled = !(q1Val && q2Val);
          };

          q1.addEventListener("input", updateSaveEnabled);
          q2.addEventListener("input", updateSaveEnabled);

          saveRow.appendChild(saveBtn);
          card.appendChild(saveRow);
        } else {
          const options = [
            { value: "yes_nafi", label: "Nafi" },
            { value: "no_not_nafi", label: "Not Nafi" },
            { value: "more_info_needed", label: "More Info Needed" },
          ];

          const optionsBlock = document.createElement("div");
          optionsBlock.className = "nafi-tutorial-options";

          options.forEach((opt) => {
            const row = document.createElement("label");
            row.className = "nafi-tutorial-option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "nafi-tutorial-answer";
            input.value = opt.value;

            const label = document.createElement("div");
            label.textContent = opt.label;

            row.appendChild(input);
            row.appendChild(label);
            optionsBlock.appendChild(row);
          });

          card.appendChild(optionsBlock);

          const actionRow = document.createElement("div");
          actionRow.className = "nafi-tutorial-action-row";

          const submitBtn = document.createElement("button");
          submitBtn.id = "nafi-tutorial-submit-btn";
          submitBtn.className = "nafi-tutorial-action-btn";
          submitBtn.disabled = true;
          submitBtn.textContent = "Submit";
          submitBtn.addEventListener("click", submitNafiTutorialAnswer);

          optionsBlock.addEventListener("change", () => {
            const checked = ui.querySelector(
              'input[name="nafi-tutorial-answer"]:checked',
            );
            submitBtn.disabled = !checked;
          });

          actionRow.appendChild(submitBtn);
          card.appendChild(actionRow);
        }

        ui.appendChild(card);
        scrollToBottom();
      }

      function getSelectedNafiTutorialAnswer() {
        const checked = document.querySelector(
          'input[name="nafi-tutorial-answer"]:checked',
        );
        return checked ? checked.value : null;
      }

      async function submitNafiTutorialAnswer() {
        if (nafiTutorialProcessing) return;

        const selected = getSelectedNafiTutorialAnswer();
        if (!selected) return;

        nafiTutorialLastAnswer = selected;
        nafiTutorialProcessing = true;

        const submitBtn = document.getElementById("nafi-tutorial-submit-btn");
        if (submitBtn) submitBtn.disabled = true;

        showTypingIndicator();
        let success = false;
        try {
          const data = await callNafiTutorialApi({ answer: selected });
          await renderNafiTutorialStep(data);
          success = true;
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
        } finally {
          hideTypingIndicator();
          nafiTutorialProcessing = false;
          if (!success && submitBtn) submitBtn.disabled = false;
        }
      }

      async function saveNafiTutorialFollowupQuestions() {
        if (nafiTutorialProcessing) return;

        const q1El = document.getElementById("nafi-tutorial-followup-q1");
        const q2El = document.getElementById("nafi-tutorial-followup-q2");
        const q1 = q1El ? q1El.value.trim() : "";
        const q2 = q2El ? q2El.value.trim() : "";

        if (!q1 || !q2) return;

        nafiTutorialProcessing = true;

        const saveBtn = document.getElementById("nafi-tutorial-save-btn");
        if (saveBtn) saveBtn.disabled = true;

        showTypingIndicator();
        let success = false;
        try {
          const data = await callNafiTutorialApi({
            followup_questions: [q1, q2],
          });
          nafiTutorialLastAnswer = null;
          await renderNafiTutorialStep(data);
          success = true;
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
        } finally {
          hideTypingIndicator();
          nafiTutorialProcessing = false;
          if (!success && saveBtn) saveBtn.disabled = false;
        }
      }

      async function sendNafiMessage() {
        if (isProcessing) return;

        const input = document.getElementById("message-input");
        const message = input.value.trim();
        if (!message) return;

        isProcessing = true;
        const sendBtn = document.getElementById("send-btn");
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<span class="spinner"></span>';

        addMessage("user", message);
        input.value = "";
        showTypingIndicator();

        let payload;
        if (nafiAwaitingFollowUp) {
          payload = {
            intake_description: nafiLastIntakeDescription,
            followup_answers: [message],
          };
        } else {
          nafiLastIntakeDescription = message;
          payload = { intake_description: message };
        }

        try {
          const response = await fetch(
            `${API_BASE_URL}/ramoslaw_chatgpt/chat/nafi`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${localStorage.getItem("jwtsopchatbot")}`,
                "ngrok-skip-browser-warning": "true",
              },
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json();
          await renderNafiResponse(data);
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
          nafiAwaitingFollowUp = false;
        } finally {
          hideTypingIndicator();
          isProcessing = false;
          sendBtn.disabled = false;
          sendBtn.innerHTML = `<span data-i18n="send">${await Translator.translate("Send", window.currentLang)}</span>`;
          scrollToBottom();
        }
      }

      async function renderNafiResponse(data) {
        const result = data.result || "";
        const confidence = data.confidence || "";
        const why = data.why || "";
        const nextQuestions = data.next_questions || [];
        const hasQuestions = nextQuestions.length > 0;
        const prompt_log_id = data.prompt_log_id || null;

        let cardClass = "nafi-more-info";
        let icon = "⚠️";
        let headerLabel = await Translator.translate(
          result,
          window.currentLang,
        );

        if (result === "Likely NAFI") {
          cardClass = "nafi-likely";
          icon = "🚫";
        } else if (result === "Not NAFI") {
          cardClass = "nafi-not";
          icon = "✅";
        } else {
          cardClass = "nafi-more-info";
          icon = "⚠️";
        }

        nafiAwaitingFollowUp = hasQuestions;
        if (hasQuestions) {
          document.getElementById("message-input").placeholder =
            await Translator.translate(
              "Type your answers to the questions above...",
              window.currentLang,
            );
        } else {
          document.getElementById("message-input").placeholder =
            await Translator.translate(
              "Enter your NAFI case details...",
              window.currentLang,
            );
        }

        const messagesDiv = document.getElementById("chat-messages");
        const emptyState = messagesDiv.querySelector(".empty-state");
        if (emptyState) emptyState.remove();

        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper assistant";

        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.style.padding = "0";
        messageDiv.style.background = "transparent";
        messageDiv.style.border = "none";
        messageDiv.style.boxShadow = "none";
        messageDiv.style.maxWidth = "85%";

        const card = document.createElement("div");
        card.className = `nafi-response-card ${cardClass}`;
        card.style.position = "relative";

        const header = document.createElement("div");
        header.className = "nafi-card-header";
        header.innerHTML = `<span>${icon}</span><span>${headerLabel}</span>`;
        card.appendChild(header);

        const body = document.createElement("div");
        body.className = "nafi-card-body";
        if (prompt_log_id) {
          body.style.paddingBottom = "40px";
        }

        const resultRow = document.createElement("div");
        resultRow.className = "nafi-field-row";
        resultRow.innerHTML = `
        <span class="nafi-field-label" data-i18n="resultLabel">${await Translator.translate("Result:", window.currentLang)}</span>
        <span class="nafi-field-value translateable-message" data-original-content="${result}">
          <span class="message-body">${await Translator.translate(result, window.currentLang)}</span>
        </span>`;
        body.appendChild(resultRow);

        const confRow = document.createElement("div");
        confRow.className = "nafi-field-row";
        confRow.innerHTML = `
        <span class="nafi-field-label" data-i18n="confidenceLabel">${await Translator.translate("Confidence:", window.currentLang)}</span>
        <span class="nafi-field-value translateable-message" data-original-content="${confidence}">
          <span class="message-body">${await Translator.translate(confidence, window.currentLang)}</span>
        </span>`;
        body.appendChild(confRow);

        const whyRow = document.createElement("div");
        whyRow.className = "nafi-field-row";
        whyRow.innerHTML = `
        <span class="nafi-field-label" data-i18n="whyLabel">${await Translator.translate("Why:", window.currentLang)}</span>
        <span class="nafi-field-value translateable-message" data-original-content="${why.replace(/"/g, "&quot;")}">
          <span class="message-body">${await Translator.translate(why, window.currentLang)}</span>
        </span>`;
        body.appendChild(whyRow);

        if (result === "More Information Needed" && hasQuestions) {
          const qSection = document.createElement("div");
          qSection.className = "nafi-questions-section";

          const qTitle = document.createElement("div");
          qTitle.className = "nafi-questions-title";
          qTitle.textContent = await Translator.translate(
            "Follow-up Questions:",
            window.currentLang,
          );
          qSection.appendChild(qTitle);

          for (const q of nextQuestions) {
            const idx = nextQuestions.indexOf(q);
            const qItem = document.createElement("div");
            qItem.className = "nafi-question-item";
            const translatedQ = await Translator.translate(
              q,
              window.currentLang,
            );
            qItem.innerHTML = `
            <span class="nafi-question-num">${idx + 1}.</span>
            <span class="translateable-message" data-original-content="${q.replace(/"/g, "&quot;")}">
              <span class="message-body">${translatedQ}</span>
            </span>`;
            qSection.appendChild(qItem);
          }

          body.appendChild(qSection);
        }

        card.appendChild(body);

        if (prompt_log_id) {
          const fb = document.createElement("div");
          fb.className = "feedback-buttons";
          fb.style.position = "absolute";
          fb.style.bottom = "8px";
          fb.style.left = "18px";

          const upBtn = document.createElement("button");
          upBtn.className = "feedback-btn";
          upBtn.title = await Translator.translate(
            "Helpful",
            window.currentLang,
          );
          upBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 2 7.59 8.59C7.22 8.95 7 9.45 7 10v8c0 1.1.9 2 2 2h7c.83 0 1.54-.5 1.84-1.22L23 12.5c.11-.33.16-.68.16-1z"/>
            </svg>
          `;

          const downBtn = document.createElement("button");
          downBtn.className = "feedback-btn";
          downBtn.title = await Translator.translate(
            "Not helpful",
            window.currentLang,
          );
          downBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M23 3h-4v12h4V3zM1 14c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 22l6.58-6.59c.37-.36.59-.86.59-1.41V6c0-1.1-.9-2-2-2H7c-.83 0-1.54.5-1.84 1.22L1 11.5C.89 11.83.84 12.18.84 12.5c0 .33.05.68.16 1z"/>
            </svg>
          `;

          upBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (upBtn.classList.contains("disabled")) return;
            sendFeedback(prompt_log_id, "up", upBtn, downBtn);
          });

          downBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (downBtn.classList.contains("disabled")) return;
            sendFeedback(prompt_log_id, "down", upBtn, downBtn);
          });

          fb.appendChild(upBtn);
          fb.appendChild(downBtn);
          card.appendChild(fb);
        }

        messageDiv.appendChild(card);
        wrapper.appendChild(messageDiv);
        messagesDiv.appendChild(wrapper);
        scrollToBottom();
      }

      // ============ END NAFI CASE SCREEN ============
    </script>

    <script>
      // Check token on page load and toggle UIs accordingly
      function checkAuthToken() {
        const token = localStorage.getItem("jwtsopchatbot");
        const loginPageWrapper = document.getElementById("login-page-wrapper");
        const mainAppWrapper = document.getElementById("main-app-wrapper");
        const messagesDiv = document.getElementById("chat-messages");

        if (token) {
          loginPageWrapper.style.display = "none";
          mainAppWrapper.style.display = "flex";

          const hasChatItems = !!messagesDiv?.querySelector(
            ".message-wrapper, .typing-wrapper, .empty-state",
          );
          if (messagesDiv && !hasChatItems) {
            startNafiChat();
          }
          loadActiveUsers();
        } else {
          loginPageWrapper.style.display = "flex";
          mainAppWrapper.style.display = "none";
        }
      }

      document.addEventListener("DOMContentLoaded", checkAuthToken);

      window.addEventListener("logout-success", () => {
        setTimeout(checkAuthToken, 100);
      });

      window.addEventListener("login-success", () => {
        setTimeout(() => {
          checkAuthToken();
        }, 100);
      });

      // ============ FEATURE: ACTIVE USERS COUNT ============
      async function loadActiveUsers() {
        try {
          const token = localStorage.getItem("jwtsopchatbot");
          if (!token) return;

          const response = await fetch(
            `${API_BASE_URL}/ramoslaw_chatgpt/active-today`,
            {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`,
                "ngrok-skip-browser-warning": "true",
              },
            },
          );

          const data = await response.json();

          if (Array.isArray(data)) {
            const count = data.length;
            const countElement = document.getElementById("active-count");
            if (countElement) {
              countElement.textContent = count;
            }

            const usersList = document.getElementById("active-users-list");
            if (usersList) {
              if (count === 0) {
                usersList.innerHTML =
                  '<div style="padding: 8px 0; color: #666;">No active users</div>';
              } else {
                usersList.innerHTML = data
                  .map(
                    (user) => `
                  <div style="
                    padding: 10px 8px;
                    border-bottom: 1px solid rgba(241, 196, 15, 0.2);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    gap: 16px;
                  ">
                    <span style="color: #f1c40f; font-weight: 500; flex: 1;">${user.email}</span>
                    <span style="color: #aaa; font-size: 12px; white-space: nowrap; flex-shrink: 0;">${formatLastActive(user.last_active)}</span>
                  </div>
                `,
                  )
                  .join("");
              }
            }
          }
        } catch (error) {
          console.error("Failed to load active users:", error);
        }
      }

      function formatLastActive(dateStr) {
        try {
          const date = new Date(dateStr);
          const now = new Date();
          const diffMs = now - date;
          const diffMins = Math.floor(diffMs / 60000);
          const diffHours = Math.floor(diffMs / 3600000);
          const diffDays = Math.floor(diffMs / 86400000);

          if (diffMins < 1) return "just now";
          if (diffMins < 60) return `${diffMins}m ago`;
          if (diffHours < 24) return `${diffHours}h ago`;
          if (diffDays < 7) return `${diffDays}d ago`;

          return date.toLocaleDateString();
        } catch (e) {
          return dateStr;
        }
      }

      function toggleActiveUsersPopover() {
        const popover = document.getElementById("active-users-popover");
        if (!popover) return;
        if (popover.style.display === "none" || popover.style.display === "") {
          popover.style.display = "block";
          loadActiveUsers();
        } else {
          popover.style.display = "none";
        }
      }

      document.addEventListener("click", function (event) {
        const popover = document.getElementById("active-users-popover");
        const btn = document.getElementById("active-users-btn");
        if (!popover || !btn) return;
        if (!btn.contains(event.target) && !popover.contains(event.target)) {
          popover.style.display = "none";
        }
      });
    </script>
  </body>
</html>
